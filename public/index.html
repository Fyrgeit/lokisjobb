<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lokisjobb - Job Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="/index.js" type="module" defer></script>
    </head>
    <body class="bg-slate-50 text-slate-800 min-h-screen">
        <header class="bg-slate-900 text-white shadow-md">
            <div
                class="max-w-7xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center gap-4"
            >
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">
                        Lokisjobb Dashboard
                    </h1>
                    <p class="text-slate-400 text-sm">
                        Aggregated Job Intelligence & Tracking
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <nav
                        class="flex items-center gap-2 bg-slate-800 p-1 rounded-lg border border-slate-700 text-sm"
                    >
                        <a
                            href="/"
                            class="px-3 py-1.5 rounded bg-indigo-600 text-white font-medium shadow transition"
                        >
                            Job Dashboard
                        </a>
                        <a
                            href="/control.html"
                            class="px-3 py-1.5 rounded text-slate-300 hover:text-white hover:bg-slate-700 transition"
                        >
                            Control Panel
                        </a>
                    </nav>
                    <button
                        id="refreshButton"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium shadow transition text-sm flex items-center gap-2"
                    >
                        <svg
                            class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                            />
                        </svg>
                        Refresh Jobs
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
            <!-- Stats Bar -->
            <section
                id="statsBar"
                class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"
            >
                <div
                    class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"
                >
                    <p
                        class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                    >
                        Total Jobs
                    </p>
                    <p
                        id="statTotal"
                        class="text-2xl font-bold text-slate-900 mt-1"
                    >
                        0
                    </p>
                </div>
                <div
                    class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"
                >
                    <p
                        class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                    >
                        Active Jobs
                    </p>
                    <p
                        id="statActive"
                        class="text-2xl font-bold text-emerald-600 mt-1"
                    >
                        0
                    </p>
                </div>
                <div
                    class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"
                >
                    <p
                        class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                    >
                        Interested
                    </p>
                    <p
                        id="statInterested"
                        class="text-2xl font-bold text-amber-600 mt-1"
                    >
                        0
                    </p>
                </div>
                <div
                    class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"
                >
                    <p
                        class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                    >
                        Applied
                    </p>
                    <p
                        id="statApplied"
                        class="text-2xl font-bold text-blue-600 mt-1"
                    >
                        0
                    </p>
                </div>
                <div
                    class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 col-span-2 sm:col-span-1"
                >
                    <p
                        class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                    >
                        Avg AI Score
                    </p>
                    <p
                        id="statAiScore"
                        class="text-2xl font-bold text-purple-600 mt-1"
                    >
                        -
                    </p>
                </div>
            </section>

            <!-- Filters & Sorting Toolbar -->
            <section
                class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between"
            >
                <div class="flex flex-wrap items-center gap-3 flex-1">
                    <div class="relative min-w-[240px] flex-1">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search title, company, location..."
                            class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        />
                        <svg
                            class="w-4 h-4 text-slate-400 absolute left-3 top-3"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                            />
                        </svg>
                    </div>

                    <div
                        class="relative inline-block text-left"
                        id="statusDropdownContainer"
                    >
                        <button
                            type="button"
                            id="statusDropdownButton"
                            class="inline-flex justify-between items-center w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                            <span id="statusDropdownLabel">Status: All</span>
                            <svg
                                class="w-4 h-4 ml-2 -mr-1"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M19 9l-7 7-7-7"
                                />
                            </svg>
                        </button>
                        <div
                            id="statusDropdownMenu"
                            class="hidden origin-top-right absolute left-0 mt-2 w-48 rounded-lg shadow-lg bg-white ring-1 ring-black ring-opacity-5 p-2 z-10 space-y-1"
                        >
                            <label
                                class="flex items-center px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer text-sm text-slate-700"
                            >
                                <input
                                    type="checkbox"
                                    name="statusFilter"
                                    value="interested"
                                    class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 mr-2"
                                />
                                Interested
                            </label>
                            <label
                                class="flex items-center px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer text-sm text-slate-700"
                            >
                                <input
                                    type="checkbox"
                                    name="statusFilter"
                                    value="applied"
                                    class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 mr-2"
                                />
                                Applied
                            </label>
                            <label
                                class="flex items-center px-2 py-1.5 hover:bg-slate-50 rounded cursor-pointer text-sm text-slate-700"
                            >
                                <input
                                    type="checkbox"
                                    name="statusFilter"
                                    value="irrelevant"
                                    class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 mr-2"
                                />
                                Irrelevant
                            </label>
                        </div>
                    </div>

                    <select
                        id="availabilityFilter"
                        class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="">All Availability</option>
                        <option value="active">Active</option>
                        <option value="closed">Closed</option>
                        <option value="unknown">Unknown</option>
                    </select>

                    <select
                        id="sourceFilter"
                        class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="">All Providers</option>
                    </select>
                </div>

                <div class="flex items-center gap-2">
                    <label
                        for="sortSelect"
                        class="text-sm font-medium text-slate-600 whitespace-nowrap"
                        >Sort by:</label
                    >
                    <select
                        id="sortSelect"
                        class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="discovered-desc">
                            Discovered (Newest)
                        </option>
                        <option value="discovered-asc">
                            Discovered (Oldest)
                        </option>
                        <option value="score-desc">AI Score (Highest)</option>
                        <option value="score-asc">AI Score (Lowest)</option>
                        <option value="title-asc">Title (A-Z)</option>
                        <option value="company-asc">Company (A-Z)</option>
                        <option value="deadline-asc">Deadline (Soonest)</option>
                        <option value="deadline-desc">Deadline (Latest)</option>
                    </select>
                </div>
            </section>

            <!-- Job Cards Container -->
            <section>
                <div
                    id="jobCountLabel"
                    class="text-sm font-medium text-slate-500 mb-4"
                >
                    Showing 0 jobs
                </div>
                <div
                    id="output"
                    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
                >
                    <!-- Job cards inserted dynamically here -->
                </div>
            </section>
        </main>
    </body>
</html>
